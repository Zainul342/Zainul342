<svg fill="none" viewBox="0 0 850 240" width="850" height="240" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        @keyframes pulse {
          0%, 100% { transform: scale(1); opacity: 0.6; }
          50% { transform: scale(1.2); opacity: 1; filter: drop-shadow(0 0 8px #00bfff); }
        }
        @keyframes dash {
          to { stroke-dashoffset: -40; }
        }
        @keyframes scanline {
          0% { transform: translateY(-240px); }
          100% { transform: translateY(240px); }
        }
        .container {
          background-color: #020914;
          height: 240px;
          border-radius: 12px;
          border: 1px solid #00bfff40;
          font-family: 'SF Pro Display', -apple-system, 'Segoe UI', Roboto, Helvetica, sans-serif;
          position: relative;
          overflow: hidden;
          box-sizing: border-box;
          padding: 30px;
          display: flex;
          justify-content: space-between;
          color: #ffffff;
        }
        .container::after {
          content: " ";
          display: block;
          position: absolute;
          top: 0; left: 0; bottom: 0; right: 0;
          background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
          z-index: 2;
          background-size: 100% 2px, 3px 100%;
          pointer-events: none;
        }
        .left-content {
          max-width: 58%;
          display: flex;
          flex-direction: column;
          justify-content: center;
          z-index: 10;
        }
        .title {
          font-family: 'Courier New', Courier, monospace;
          font-size: 40px;
          font-weight: 900;
          color: #00bfff;
          letter-spacing: 2px;
          margin: 0 0 10px 0;
          text-shadow: 0 0 10px rgba(0, 191, 255, 0.5);
        }
        .subtitle {
          font-size: 15px;
          line-height: 1.5;
          color: #a0aec0;
          margin: 0 0 15px 0;
        }
        .philosophies {
          font-size: 13px;
          color: #4cd964;
          font-family: monospace;
          margin: 0;
        }
        .right-content {
          width: 38%;
          position: relative;
          display: flex;
          flex-direction: column;
          justify-content: center;
          align-items: flex-end;
          z-index: 10;
        }
        .contacts {
          display: flex;
          flex-direction: column;
          gap: 10px;
          align-items: flex-start;
          background: rgba(0, 191, 255, 0.03);
          border-left: 2px solid #00bfff;
          padding: 10px 15px;
          border-radius: 0 8px 8px 0;
          font-size: 13px;
          color: #a0aec0;
        }
        .contact-item {
          display: flex;
          align-items: center;
          gap: 8px;
        }
        .contact-item svg {
          fill: #00bfff;
        }
        /* Network Animation Graphic Background */
        .network-bg {
          position: absolute;
          top: 0;
          right: 0;
          width: 100%;
          height: 100%;
          opacity: 0.15;
          z-index: 1;
          pointer-events: none;
        }
        .node {
          animation: pulse 3s infinite ease-in-out;
        }
        .n1 { animation-delay: 0s; }
        .n2 { animation-delay: 0.5s; }
        .n3 { animation-delay: 1s; }
        .n4 { animation-delay: 1.5s; }
        .n5 { animation-delay: 2s; }
        .line {
          stroke: #00bfff;
          stroke-dasharray: 5, 5;
          animation: dash 10s linear infinite;
        }
      </style>
      <div class="container">
        <!-- SVG Interactive Network (Floating behind right side) -->
        <svg class="network-bg" viewBox="0 0 300 240">
          <line class="line" x1="120" y1="50" x2="220" y2="90" stroke-width="1" />
          <line class="line" x1="220" y1="90" x2="160" y2="180" stroke-width="1" />
          <line class="line" x1="160" y1="180" x2="60" y2="130" stroke-width="1" />
          <line class="line" x1="60" y1="130" x2="120" y2="50" stroke-width="1" />
          <line class="line" x1="120" y1="50" x2="160" y2="180" stroke-width="1" />
          
          <circle class="node n1" cx="120" cy="50" r="6" fill="#00bfff" />
          <circle class="node n2" cx="220" cy="90" r="5" fill="#00bfff" />
          <circle class="node n3" cx="160" cy="180" r="6" fill="#00bfff" />
          <circle class="node n4" cx="60" cy="130" r="4" fill="#00bfff" />
        </svg>

        <div class="left-content">
          <h1 class="title">ZAINUL MUTAQIN</h1>
          <p class="subtitle">Exploring the internals of backend systems and distributed architectures. Driven by curiosity, powered by code.</p>
          <p class="philosophies">
            &gt; Focus: Backend &amp; Distributed Systems<br/>
            &gt; Curiosity driven, debugging enthusiast
          </p>
        </div>
        
        <div class="right-content">
          <div class="contacts">
            <!-- LinkedIn -->
            <div class="contact-item">
              <svg width="14" height="14" viewBox="0 0 24 24"><path d="M19 0h-14c-2.761 0-5 2.239-5 5v14c0 2.761 2.239 5 5 5h14c2.762 0 5-2.239 5-5v-14c0-2.761-2.238-5-5-5zm-11 19h-3v-11h3v11zm-1.5-12.268c-.966 0-1.75-.779-1.75-1.75s.784-1.75 1.75-1.75 1.75.779 1.75 1.75-.784 1.75-1.75 1.75zm13.5 12.268h-3v-5.604c0-3.368-4-3.113-4 0v5.604h-3v-11h3v1.765c1.396-2.586 7-2.777 7 2.476v6.759z"/></svg>
              <span>/in/zainu1342</span>
            </div>
            <!-- GitHub -->
            <div class="contact-item">
              <svg width="14" height="14" viewBox="0 0 24 24"><path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/></svg>
              <span>/zainu1342</span>
            </div>
            <!-- Email -->
            <div class="contact-item">
              <svg width="14" height="14" viewBox="0 0 24 24"><path d="M12 12.713l-11.985-9.713h23.97l-11.985 9.713zm0 2.574l-12-9.725v15.438h24v-15.438l-12 9.725z"/></svg>
              <span>zainul.mutaqin.dev</span>
            </div>
            <!-- Location -->
            <div class="contact-item">
              <svg width="14" height="14" viewBox="0 0 24 24"><path d="M12 0c-4.198 0-8 3.403-8 7.602 0 4.198 3.469 9.21 8 16.398 4.531-7.188 8-12.2 8-16.398 0-4.199-3.801-7.602-8-7.602zm0 11c-1.657 0-3-1.343-3-3s1.343-3 3-3 3 1.343 3 3-1.343 3-3 3z"/></svg>
              <span>Indonesia</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>
