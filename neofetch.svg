<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360">
  <defs>
    <style>
      .bg { fill: #1e1e2e; }
      .titlebar { fill: #181825; }
      .dot-r { fill: #f38ba8; }
      .dot-y { fill: #f9e2af; }
      .dot-g { fill: #a6e3a1; }
      .text-base { font-family: ui-monospace, 'SFMono-Regular', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; font-size: 13px; }
      .label { fill: #89b4fa; font-weight: bold; }
      .value { fill: #cdd6f4; }
      .sep   { fill: #6c7086; }
      .user  { fill: #a6e3a1; font-weight: bold; }
      .host  { fill: #cba6f7; font-weight: bold; }
      .line  { fill: #313244; }
      .arch1 { fill: #89b4fa; }
      .arch2 { fill: #7287fd; }
    </style>
    <clipPath id="roundedClip">
      <rect width="800" height="360" rx="12" ry="12"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="800" height="360" rx="12" ry="12" class="bg"/>

  <!-- Titlebar -->
  <rect width="800" height="36" rx="12" ry="12" class="titlebar" clip-path="url(#roundedClip)"/>
  <rect y="18" width="800" height="18" class="titlebar"/>

  <!-- Window dots -->
  <circle cx="20" cy="18" r="6" class="dot-r"/>
  <circle cx="40" cy="18" r="6" class="dot-y"/>
  <circle cx="60" cy="18" r="6" class="dot-g"/>

  <!-- Window title -->
  <text x="400" y="23" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#6c7086">zainm@archlinux — neofetch</text>

  <!-- Divider line -->
  <rect x="0" y="36" width="800" height="1" fill="#313244"/>

  <!-- Arch Linux ASCII Art (left side) -->
  <!-- Centered vertically on the left column -->
  <g class="text-base" font-weight="bold">
    <text x="40" y="90"  class="arch1">        /\</text>
    <text x="40" y="108" class="arch1">       /  \</text>
    <text x="40" y="126" class="arch1">      / /\ \</text>
    <text x="40" y="144" class="arch1">     / /  \ \</text>
    <text x="40" y="162" class="arch2">    / /  __\ \</text>
    <text x="40" y="180" class="arch2">   / /___\  \ \</text>
    <text x="40" y="198" class="arch2">  /________\ \ \</text>
    <text x="40" y="216" class="arch2"> /___________\/</text>
  </g>

  <!-- Color palette dots -->
  <circle cx="50"  cy="255" r="7" fill="#f38ba8"/>
  <circle cx="68"  cy="255" r="7" fill="#fab387"/>
  <circle cx="86"  cy="255" r="7" fill="#f9e2af"/>
  <circle cx="104" cy="255" r="7" fill="#a6e3a1"/>
  <circle cx="122" cy="255" r="7" fill="#89dceb"/>
  <circle cx="140" cy="255" r="7" fill="#89b4fa"/>
  <circle cx="158" cy="255" r="7" fill="#cba6f7"/>
  <circle cx="176" cy="255" r="7" fill="#cdd6f4"/>

  <!-- Vertical separator (Symmetric positioning) -->
  <rect x="235" y="37" width="1" height="323" class="line"/>

  <!-- Right side: Info (Strict Grid Alignment using absolute X values) -->
  <!-- user@host -->
  <text x="260" y="80" class="text-base">
    <tspan class="user">zainm</tspan><tspan class="sep">@</tspan><tspan class="host">archlinux</tspan>
  </text>
  <rect x="260" y="88" width="490" height="1" class="line"/>

  <!-- Info rows -->
  <g class="text-base">
    <!-- OS -->
    <text x="260" y="112" class="label">OS</text>
    <text x="330" y="112" class="sep">:</text>
    <text x="345" y="112" class="value">Arch Linux (EndeavourOS)</text>

    <!-- Host -->
    <text x="260" y="130" class="label">Host</text>
    <text x="330" y="130" class="sep">:</text>
    <text x="345" y="130" class="value">ThinkPad T490s (8GB RAM)</text>

    <!-- Kernel -->
    <text x="260" y="148" class="label">Kernel</text>
    <text x="330" y="148" class="sep">:</text>
    <text x="345" y="148" class="value">Linux x86_64</text>

    <!-- Shell -->
    <text x="260" y="166" class="label">Shell</text>
    <text x="330" y="166" class="sep">:</text>
    <text x="345" y="166" class="value">zsh + starship</text>

    <!-- Terminal -->
    <text x="260" y="184" class="label">Terminal</text>
    <text x="330" y="184" class="sep">:</text>
    <text x="345" y="184" class="value">Ghostty</text>

    <!-- Editor -->
    <text x="260" y="202" class="label">Editor</text>
    <text x="330" y="202" class="sep">:</text>
    <text x="345" y="202" class="value">Neovim (kickstart)</text>

    <!-- Theme -->
    <text x="260" y="220" class="label">Theme</text>
    <text x="330" y="220" class="sep">:</text>
    <text x="345" y="220" class="value">Catppuccin Mocha</text>

    <!-- WM/Bar -->
    <text x="260" y="238" class="label">WM/Bar</text>
    <text x="330" y="238" class="sep">:</text>
    <text x="345" y="238" class="value">bspwm + Polybar</text>
  </g>

  <!-- Horizontal separator -->
  <rect x="260" y="250" width="490" height="1" class="line"/>

  <!-- Focus section (Also aligned strictly on the same grid) -->
  <g class="text-base">
    <!-- Focus -->
    <text x="260" y="276" class="label">Focus</text>
    <text x="330" y="276" class="sep">:</text>
    <text x="345" y="276" class="value">Full-stack Web (TS/JS)</text>

    <!-- Learning -->
    <text x="260" y="294" class="label">Learning</text>
    <text x="330" y="294" class="sep">:</text>
    <text x="345" y="294" class="value">CS Basics · Data Structures</text>

    <!-- Status -->
    <text x="260" y="312" class="label">Status</text>
    <text x="330" y="312" class="sep">:</text>
    <text x="345" y="312" class="value">Exploring new horizons</text>

    <!-- Location -->
    <text x="260" y="330" class="label">Location</text>
    <text x="330" y="330" class="sep">:</text>
    <text x="345" y="330" class="value">Malang, Indonesia 🇮🇩</text>
  </g>
</svg>
