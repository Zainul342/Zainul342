<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="800" height="320">
  <defs>
    <style>
      .bg { fill: #1e1e2e; }
      .titlebar { fill: #181825; }
      .dot-r { fill: #f38ba8; }
      .dot-y { fill: #f9e2af; }
      .dot-g { fill: #a6e3a1; }
      .label { fill: #89b4fa; font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 700; }
      .value { fill: #cdd6f4; font-family: 'JetBrains Mono', monospace; font-size: 13px; }
      .sep   { fill: #6c7086; font-family: 'JetBrains Mono', monospace; font-size: 13px; }
      .user  { fill: #a6e3a1; font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 700; }
      .host  { fill: #cba6f7; font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 700; }
      .line  { fill: #45475a; }
    </style>
    <clipPath id="roundedClip">
      <rect width="800" height="320" rx="12" ry="12"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="800" height="320" rx="12" ry="12" class="bg"/>

  <!-- Titlebar -->
  <rect width="800" height="36" rx="12" ry="12" class="titlebar" clip-path="url(#roundedClip)"/>
  <rect y="18" width="800" height="18" class="titlebar"/>

  <!-- Window dots -->
  <circle cx="20" cy="18" r="6" class="dot-r"/>
  <circle cx="40" cy="18" r="6" class="dot-y"/>
  <circle cx="60" cy="18" r="6" class="dot-g"/>

  <!-- Window title -->
  <text x="400" y="23" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="12" fill="#6c7086">zcyty@cachy-pad — zsh</text>

  <!-- Divider line -->
  <rect x="0" y="36" width="800" height="1" class="line"/>

  <!-- Cute Couple Neko ASCII Art (left side) -->
  <text x="30" y="105" xml:space="preserve" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="700" fill="#f5e0dc">      へ  <tspan fill="#f38ba8">♡</tspan>  ╮|、</text>
  <text x="30" y="130" xml:space="preserve" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="700" fill="#f5e0dc">   丽 - ੮)   (` - 7</text>
  <text x="30" y="155" xml:space="preserve" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="700" fill="#f5e0dc">    /⁺ ɬ|   |、੮じ</text>
  <text x="30" y="180" xml:space="preserve" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="700" fill="#f5e0dc">じ(ˤل  ل   じじˤ,)ノ</text>

  <!-- Color palette dots -->
  <circle cx="40"  cy="255" r="7" fill="#f38ba8"/>
  <circle cx="58"  cy="255" r="7" fill="#fab387"/>
  <circle cx="80"  cy="255" r="7" fill="#f9e2af"/>
  <circle cx="98"  cy="255" r="7" fill="#a6e3a1"/>
  <circle cx="116" cy="255" r="7" fill="#89dceb"/>
  <circle cx="134" cy="255" r="7" fill="#89b4fa"/>
  <circle cx="152" cy="255" r="7" fill="#cba6f7"/>
  <circle cx="170" cy="255" r="7" fill="#cdd6f4"/>

  <!-- Vertical separator -->
  <rect x="240" y="52" width="1" height="240" fill="#313244"/>

  <!-- Right side: Info -->
  <!-- user@host -->
  <text x="260" y="80">
    <tspan class="user">zcyty</tspan>
    <tspan class="sep">@</tspan>
    <tspan class="host">cachy-pad</tspan>
  </text>
  <rect x="260" y="88" width="180" height="1" fill="#313244"/>

  <!-- Info rows -->
  <text x="260" y="104"><tspan class="label">OS</tspan><tspan class="sep">       : </tspan><tspan class="value">CachyOS Linux x86_64</tspan></text>
  <text x="260" y="122"><tspan class="label">Host</tspan><tspan class="sep">     : </tspan><tspan class="value">ThinkPad T490s (Intel i7, 8GB RAM)</tspan></text>
  <text x="260" y="140"><tspan class="label">WM</tspan><tspan class="sep">       : </tspan><tspan class="value">Hyprland (Wayland)</tspan></text>
  <text x="260" y="158"><tspan class="label">Shell</tspan><tspan class="sep">    : </tspan><tspan class="value">zsh + powerlevel10k</tspan></text>
  <text x="260" y="176"><tspan class="label">Terminal</tspan><tspan class="sep"> : </tspan><tspan class="value">Alacritty</tspan></text>
  <text x="260" y="194"><tspan class="label">Focus</tspan><tspan class="sep">    : </tspan><tspan class="value">Fullstack Dev | Java &amp; CyberSec</tspan></text>

  <!-- Bottom Quote -->
  <text x="260" y="235" font-family="'JetBrains Mono', monospace" font-size="12" font-style="italic" fill="#a6adc8">"Exploring fullstack architecture &amp; security."</text>
</svg>
